<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About — Multipurpose Coding</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent: #008c44;
      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --card-bg: #f7f7f7;
      --radius: 12px;
      --max-width: 1100px;
      --shadow-color: rgba(0,0,0,0.06);
      --base-font-size: 18px;
      --h1-size: 34px;
      --title-size: 26px;
      --name-size: 20px;
      --info-size: 14px;
    }

    html.dark {
      --bg: #0b0b0b;
      --text: #f7f7f7;
      --muted: #bdbdbd;
      --card-bg: #0f0f10;
      --shadow-color: rgba(255,255,255,0.04);
      --accent: #00a657;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Lexend", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:var(--text);
      font-size:var(--base-font-size);
      -webkit-font-smoothing:antialiased;
    }

    .container{
      max-width:var(--max-width);
      margin:36px auto;
      padding:28px;
    }

    header.nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      margin-bottom:22px;
    }
    .brand { display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--text); }
    .logo{
      width:56px; height:56px; border-radius:10px;
      background:linear-gradient(135deg,var(--accent),#06aa5a);
      display:flex; align-items:center; justify-content:center;
      color:white; font-family:"Oswald"; font-weight:800; font-size:20px;
    }
    .brand h1{ margin:0; font-family:"Oswald"; font-size:var(--h1-size); font-weight:800; }

    nav.primary { display:flex; gap:14px; align-items:center; }
    nav.primary a { text-decoration:none; color:var(--text); font-weight:700; padding:6px 10px; border-radius:8px; }
    nav.primary a:hover{ background:var(--card-bg); }
    
    .toggle {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      color:var(--muted);
      user-select:none;
    }
    .switch {
      --w: var(--toggle-size);
      --h: calc(var(--toggle-size) / 2);
      position:relative;
      width:var(--w);
      height:var(--h);
      background:linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.01));
      border-radius:999px;
      padding:5px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      transition:box-shadow .18s ease, background .18s ease, transform .12s ease;
      box-shadow: 0 8px 28px rgba(0,0,0,0.06);
    }
    .switch:focus { outline: 2px solid color-mix(in srgb, var(--accent) 36%, transparent); outline-offset:4px; }
    .switch input { display:none; }
    .knob {
      width: calc(var(--h) - 6px);
      height: calc(var(--h) - 6px);
      background:white;
      border-radius:50%;
      transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s;
      transform: translateX(0);
      box-shadow:0 8px 22px rgba(0,0,0,0.12);
    }
    /* when dark: move knob right, change switch background to accent and add glow */
    html.dark .switch {
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 24%, transparent), rgba(0,0,0,0.06));
      box-shadow: 0 10px 36px rgba(0,0,0,0.12), 0 0 20px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    html.dark .knob { transform: translateX(calc(var(--w) - var(--h))); box-shadow: 0 10px 28px rgba(0,0,0,0.18); }

    .switch .icon {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:14px;
      line-height:1;
      pointer-events:none;
      opacity:0.95;
    }

    /* Team grid: 3 columns */
    .team-grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:22px;
      align-items:start;
    }

    .member {
      background:var(--card-bg);
      border-radius:12px;
      padding:20px;
      text-align:center;
      box-shadow: 6px 6px 0 var(--shadow-color);
      min-height: 360px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:16px;
    }

    /* Square image with 5px black outline */
    .portrait {
      width:100%;
      max-width:380px;
      aspect-ratio:1/1; /* keep square */
      object-fit:cover;
      display:block;
      border:5px solid #000;
      border-radius:6px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
      background:#e9e9e9;
    }

    /* Title (big) below image */
    .member .role {
      font-family:"Oswald",sans-serif;
      font-size:var(--title-size);
      font-weight:800;
      margin:0;
      color:var(--text);
    }

    /* Slightly smaller name box */
    .member .name {
      display:inline-block;
      padding:10px 14px;
      margin-top:4px;
      font-size:var(--name-size);
      font-weight:700;
      border-radius:8px;
      background:transparent;
      color:var(--text);
      min-width:60%;
      border:2px solid rgba(0,0,0,0.06);
    }

    /* Info word box below that */
    .member .info {
      margin-top:8px;
      font-size:var(--info-size);
      color:var(--muted);
      padding:8px 12px;
      background:linear-gradient(180deg, rgba(0,0,0,0.02), transparent);
      border-radius:8px;
      min-width:70%;
    }

    /* Responsive: stack on small screens */
    @media (max-width:1000px){
      .team-grid { grid-template-columns: 1fr; }
      .portrait { max-width:640px; width:100%; }
      :root { --h1-size:28px; --title-size:22px; --name-size:18px; --info-size:15px; }
      .member { min-height:300px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="nav" role="banner">
      <a class="brand" href="index.html" aria-label="Multipurpose Coding Home">
        <div class="logo">MC</div>
        <h1>Multipurpose Coding</h1>
      </a>

      <nav class="primary" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

        <div class="toggle" title="Dark mode toggle">
          <label class="switch" aria-hidden="false" tabindex="0" role="switch" aria-checked="false" id="switchLabel">
            <input id="darkToggle" type="checkbox" aria-label="Toggle dark mode">
            <span class="knob" aria-hidden="true"></span>
          </label>
          <span style="font-weight:700;color:var(--muted);font-size:0.98rem;">Dark</span>
        </div>
      </nav>
      </nav>
    </header>

    <main>
      <section class="team-grid" aria-label="Club officers">
        <!-- President -->
        <article class="member" aria-labelledby="pres-role">
          <img class="portrait" src="assets/images/president.jpg" alt="photo of me :o if it doesnt appear that means it didn't load or i didn't put an image :/">
          <div id="pres-role" class="role">President</div>
          <div class="name">William Xiong</div>
          <div class="info">Junior, likes making all sorts of things. </div>
        </article>

        <!-- VP -->
        <article class="member" aria-labelledby="vp-role">
          <img class="portrait" src="assets/images/vp.jpg" alt="photo of the vice prez. if it doesnt appear that means it didn't load or i didn't put an image">
          <div id="vp-role" class="role">VP</div>
          <div class="name">Riland Yen</div>
          <div class="info">Junior, likes to hang out w/ friends</div>
        </article>

        <!-- Advisor -->
        <article class="member" aria-labelledby="adv-role">
          <img class="portrait" src="assets/images/advisor.jpg" alt="photo of mr nelson. if it doesnt appear, it didn't load or i didn't put an image">
          <div id="adv-role" class="role">Advisor</div>
          <div class="name">Mr. Nelson</div>
          <div class="info">The GOAT! He teaches NGSS and AP Physics. </div>
        </article>
      </section>
    </main>
  </div>

  <script>
    // Dark mode toggle script (keeps your localStorage key and ids consistent)
    (function () {
      const toggle = document.getElementById('darkToggle');
      const rootEl = document.documentElement;
      const storageKey = 'mpc-dark';
      const switchLabel = document.getElementById('switchLabel');

      (function initTheme(){
        const saved = localStorage.getItem(storageKey);
        if (saved !== null) {
          if (saved === '1') {
            rootEl.classList.add('dark');
            toggle.checked = true;
            switchLabel.setAttribute('aria-checked','true');
          } else {
            rootEl.classList.remove('dark');
            toggle.checked = false;
            switchLabel.setAttribute('aria-checked','false');
          }
        } else {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersDark) {
            rootEl.classList.add('dark'); toggle.checked = true; switchLabel.setAttribute('aria-checked','true');
          }
        }
      })();

      function setTheme(on) {
        if (on) {
          rootEl.classList.add('dark');
          localStorage.setItem(storageKey,'1');
          switchLabel.setAttribute('aria-checked','true');
        } else {
          rootEl.classList.remove('dark');
          localStorage.setItem(storageKey,'0');
          switchLabel.setAttribute('aria-checked','false');
        }
      }

      toggle.addEventListener('change', () => setTheme(toggle.checked));

      // keyboard + click support on the visible switch wrapper
      document.querySelectorAll('.switch').forEach(s => {
        s.addEventListener('keydown', e => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            toggle.checked = !toggle.checked;
            toggle.dispatchEvent(new Event('change'));
          }
        });
        s.addEventListener('click', (ev) => {
          if (ev.target.tagName.toLowerCase() === 'a') return;
          toggle.checked = !toggle.checked;
          toggle.dispatchEvent(new Event('change'));
        });
      });
    })();
  </script>
</body>
</html>
