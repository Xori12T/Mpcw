<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>About — Multipurpose Coding</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Oswald:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --accent: #008c44;

      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --card-bg: #f7f7f7;

      --max-width: 1100px;
      --shadow-color: rgba(0, 0, 0, 0.06);

      --toggle-size: 52px;

      --base-font-size: 18px;
      --h1-size: 34px;

      --title-size: 26px;
      --name-size: 20px;
      --info-size: 14px;
    }

    /* DARK MODE */

    html.dark {
      --bg: #0b0b0b;
      --text: #f7f7f7;
      --muted: #bdbdbd;
      --card-bg: #0f0f10;

      --shadow-color: rgba(255, 255, 255, 0.04);

      --accent: #00a657;
    }


    /* GENERAL */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        "Lexend",
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      font-size: var(--base-font-size);
      line-height: 1.5;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: var(--max-width);

      margin: 36px auto;
      padding: 28px;
    }


    header.nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:32px;
    }
    .brand { display:flex; gap:14px; align-items:center; color:var(--text); text-decoration:none; }
    .logo {
      width:60px; height:60px; border-radius:12px;
      background:linear-gradient(135deg,var(--accent),#06aa5a);
      display:flex; align-items:center; justify-content:center;
      color:white; font-family:"Oswald",sans-serif; font-weight:800; font-size:22px;
      box-shadow:0 8px 22px rgba(0,0,0,0.08);
    }
    .brand h1 { margin:0; font-family:"Oswald",sans-serif; font-size:var(--h1-size); font-weight:800; letter-spacing:0.6px; }

    nav.primary { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    nav.primary a { padding:8px 12px; color:var(--text); text-decoration:none; font-weight:700; border-radius:10px; transition:background .14s ease, color .14s ease; }
    nav.primary a:hover { background:var(--card-bg); }

    /* Shared dark-mode switch */
    .toggle { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:15px; user-select:none; }
    .switch {
      --w: var(--toggle-size);
      --h: calc(var(--toggle-size) / 2);
      position: relative;
      width: var(--w);
      height: var(--h);
      display: flex;
      align-items: center;
      padding: 5px;
      cursor: pointer;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 8px 28px rgba(0,0,0,0.06);
      transition: background .18s ease, box-shadow .18s ease;
    }
    .switch input { display:none; }
    .knob {
      width: calc(var(--h) - 6px);
      height: calc(var(--h) - 6px);
      background: white;
      border-radius: 50%;
      transform: translateX(0);
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
      transition: transform 0.18s cubic-bezier(.2,.9,.2,1), box-shadow 0.18s ease;
    }
    html.dark .switch {
      background:
        linear-gradient(
          90deg,
          color-mix(in srgb, var(--accent) 24%, transparent),
          rgba(0,0,0,0.06)
        );
      box-shadow:
        0 10px 36px rgba(0,0,0,0.12),
        0 0 20px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    html.dark .knob {
      transform: translateX(calc(var(--w) - var(--h)));
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      background: white;
    }
    .switch:focus-visible { outline: 3px solid var(--accent); outline-offset:4px; }
    .switch-label { font-weight:700; font-size:0.98rem; }

    /* OFFICERS */

    .team-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;
    }

    .member {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 16px;

      padding: 20px;

      text-align: center;

      background: var(--card-bg);

      border-radius: 12px;

      box-shadow:
        6px 6px 0 var(--shadow-color);
    }


    /* OFFICER IMAGES */

    .portrait {
      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      display: block;

      border: 5px solid #000;
      border-radius: 6px;

      background: #e9e9e9;
    }

    html.dark .portrait {
      border-color: white;
    }


    /* ROLE */

    .member .role {
      margin: 0;

      font-family: "Oswald", sans-serif;
      font-size: var(--title-size);
      font-weight: 800;

      color: var(--text);
    }


    /* NAME */

    .member .name {
      min-width: 60%;

      padding: 10px 14px;

      color: var(--text);

      font-size: var(--name-size);
      font-weight: 700;

      border:
        2px solid
        rgba(0, 0, 0, 0.08);

      border-radius: 8px;
    }

    html.dark .member .name {
      border-color:
        rgba(255, 255, 255, 0.12);
    }


    /* INFO */

    .member .info {
      min-width: 70%;

      padding: 8px 12px;

      color: var(--muted);

      font-size: var(--info-size);

      border-radius: 8px;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.02),
          transparent
        );
    }


    /* RESPONSIVE */

    @media (max-width: 1000px) {

      .team-grid {
        grid-template-columns: 1fr;
      }

      .portrait {
        max-width: 500px;
      }

      :root {
        --h1-size: 28px;

        --title-size: 22px;
        --name-size: 18px;
        --info-size: 15px;
      }
    }

    @media (max-width: 650px) {

      .container {
        margin: 20px auto;
        padding: 18px;
      }

      header.nav {
        align-items: flex-start;
      }

      nav.primary {
        gap: 5px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- HEADER -->

    <header class="nav" role="banner">

      <a
        class="brand"
        href="index.html"
        aria-label="Multipurpose Coding Home"
      >
        <div class="logo">MC</div>

        <h1>
          Multipurpose Coding
        </h1>
      </a>


      <nav
        class="primary"
        aria-label="Primary"
      >

        <a href="index.html">
          Home
        </a>

        <a href="about.html" aria-current="page">
          About
        </a>

        <a href="projects.html">
          Projects
        </a>


        <!-- DARK MODE -->

        <div
          class="toggle"
          title="Dark mode toggle"
        >

          <label
            class="switch"
            tabindex="0"
            role="switch"
            aria-checked="false"
            id="switchLabel"
          >

            <input
              id="darkToggle"
              type="checkbox"
              aria-label="Toggle dark mode"
            >

            <span
              class="knob"
              aria-hidden="true"
            ></span>

          </label>

          <span class="switch-label">
            Dark
          </span>

        </div>

      </nav>

    </header>


    <!-- OFFICERS -->

    <main>

      <section
        class="team-grid"
        aria-label="Club officers"
      >


        <!-- PRESIDENT -->

        <article class="member">

          <img
            class="portrait"
            src="assets/images/president.webp"
            alt="Photo of William Xiong"
          >

          <div class="role">
            President
          </div>

          <div class="name">
            William Xiong
          </div>

          <div class="info">
            Junior, likes making all sorts of things.
          </div>

        </article>


        <!-- VP -->

        <article class="member">

          <img
            class="portrait"
            src="assets/images/vp.webp"
            alt="Photo of Riland Yen"
          >

          <div class="role">
            VP
          </div>

          <div class="name">
            Riland Yen
          </div>

          <div class="info">
            Junior, likes to hang out w/ friends.
          </div>

        </article>


        <!-- ADVISOR -->

        <article class="member">

          <img
            class="portrait"
            src="assets/images/advisor.webp"
            alt="Photo of Mr. Nelson"
          >

          <div class="role">
            Advisor
          </div>

          <div class="name">
            Mr. Nelson
          </div>

          <div class="info">
            The GOAT! He teaches NGSS and AP Physics.
          </div>

        </article>

      </section>

    </main>

  </div>


  <script>
    // Shared theme switch: persist the choice and respect system preference.
    (function () {
      const toggle = document.getElementById("darkToggle");
      const switchLabel = document.getElementById("switchLabel");
      const root = document.documentElement;
      const storageKey = "mpc-dark";

      function setTheme(dark) {
        root.classList.toggle("dark", dark);
        toggle.checked = dark;
        switchLabel.setAttribute("aria-checked", dark);
        localStorage.setItem(storageKey, dark ? "1" : "0");
      }

      const saved = localStorage.getItem(storageKey);
      if (saved !== null) {
        setTheme(saved === "1");
      } else {
        setTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }

      toggle.addEventListener("change", () => setTheme(toggle.checked));

      switchLabel.addEventListener("keydown", event => {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          setTheme(!root.classList.contains("dark"));
        }
      });
    })();
  </script>

</body>

</html>
