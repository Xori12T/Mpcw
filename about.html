<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About — Multipurpose Coding</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent: #008c44;
      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --card-bg: #f7f7f7;
      --radius: 12px;
      --max-width: 1100px;
      --shadow-color: rgba(0,0,0,0.06);

      /* Dark mode toggle */
      --toggle-size: 52px;

      --base-font-size: 18px;
      --h1-size: 34px;
      --title-size: 26px;
      --name-size: 20px;
      --info-size: 14px;
    }

    /* Dark theme */
    html.dark {
      --bg: #0b0b0b;
      --text: #f7f7f7;
      --muted: #bdbdbd;
      --card-bg: #0f0f10;
      --shadow-color: rgba(255,255,255,0.04);
      --accent: #00a657;
    }

    /* Reset */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Lexend", system-ui, -apple-system, "Segoe UI",
        Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: var(--text);
      font-size: var(--base-font-size);
      line-height: 1.55;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      transition:
        background-color .18s ease,
        color .18s ease;
    }

    /* Container */
    .container {
      max-width: var(--max-width);
      margin: 36px auto;
      padding: 28px;
    }

    /* Header */
    header.nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #06aa5a
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-family: "Oswald", sans-serif;
      font-weight: 800;
      font-size: 20px;

      box-shadow:
        0 8px 22px rgba(0,0,0,0.08);
    }

    .brand h1 {
      margin: 0;
      font-family: "Oswald", sans-serif;
      font-size: var(--h1-size);
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    /* Navigation */
    nav.primary {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav.primary a {
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 10px;

      transition:
        background .14s ease,
        color .14s ease;
    }

    nav.primary a:hover {
      background: var(--card-bg);
    }

    /* =========================================
       DARK MODE TOGGLE
       Same style/functionality as first page
       ========================================= */

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: var(--muted);
      user-select: none;
    }

    .switch {
      --w: var(--toggle-size);
      --h: calc(var(--toggle-size) / 2);

      position: relative;
      width: var(--w);
      height: var(--h);

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.03),
          rgba(0,0,0,0.01)
        );

      border-radius: 999px;
      padding: 5px;
      cursor: pointer;

      display: inline-flex;
      align-items: center;

      transition:
        box-shadow .18s ease,
        background .18s ease,
        transform .12s ease;

      box-shadow:
        0 8px 28px rgba(0,0,0,0.06);
    }

    .switch:focus {
      outline:
        2px solid
        color-mix(
          in srgb,
          var(--accent) 36%,
          transparent
        );

      outline-offset: 4px;
    }

    .switch input {
      display: none;
    }

    .knob {
      width: calc(var(--h) - 6px);
      height: calc(var(--h) - 6px);

      background: white;
      border-radius: 50%;

      transition:
        transform .18s cubic-bezier(.2,.9,.2,1),
        box-shadow .18s;

      transform: translateX(0);

      box-shadow:
        0 8px 22px rgba(0,0,0,0.12);
    }

    /* Dark mode switch */
    html.dark .switch {
      background:
        linear-gradient(
          90deg,
          color-mix(
            in srgb,
            var(--accent) 24%,
            transparent
          ),
          rgba(0,0,0,0.06)
        );

      box-shadow:
        0 10px 36px rgba(0,0,0,0.12),
        0 0 20px
        color-mix(
          in srgb,
          var(--accent) 18%,
          transparent
        );
    }

    html.dark .knob {
      transform:
        translateX(
          calc(var(--w) - var(--h))
        );

      box-shadow:
        0 10px 28px rgba(0,0,0,0.18);
    }

    .switch .icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      line-height: 1;
      pointer-events: none;
      opacity: 0.95;
    }

    .switch .sun {
      left: 10px;
      color: #ffb84d;
    }

    .switch .moon {
      right: 10px;
      color: #cfe6ff;
    }

    /* =========================================
       TEAM GRID
       ========================================= */

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      align-items: start;
    }

    .member {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;

      text-align: center;

      box-shadow:
        6px 6px 0 var(--shadow-color);

      min-height: 360px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      gap: 16px;

      transition:
        background-color .18s ease,
        box-shadow .18s ease;
    }

    /* Square image with black outline */
    .portrait {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;

      object-fit: cover;
      display: block;

      border: 5px solid #000;
      border-radius: 6px;

      box-shadow:
        0 8px 18px rgba(0,0,0,0.06);

      background: #e9e9e9;
    }

    /* Role */
    .member .role {
      font-family: "Oswald", sans-serif;
      font-size: var(--title-size);
      font-weight: 800;

      margin: 0;

      color: var(--text);
    }

    /* Name */
    .member .name {
      display: inline-block;

      padding: 10px 14px;
      margin-top: 4px;

      font-size: var(--name-size);
      font-weight: 700;

      border-radius: 8px;

      background: transparent;
      color: var(--text);

      min-width: 60%;

      border:
        2px solid
        rgba(0,0,0,0.06);
    }

    /* Info */
    .member .info {
      margin-top: 8px;

      font-size: var(--info-size);
      color: var(--muted);

      padding: 8px 12px;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.02),
          transparent
        );

      border-radius: 8px;

      min-width: 70%;
    }

    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (max-width: 1000px) {

      .team-grid {
        grid-template-columns: 1fr;
      }

      .portrait {
        max-width: 640px;
        width: 100%;
      }

      :root {
        --h1-size: 28px;
        --title-size: 22px;
        --name-size: 18px;
        --info-size: 15px;
      }

      .member {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="nav" role="banner">

      <a
        class="brand"
        href="index.html"
        aria-label="Multipurpose Coding Home"
      >
        <div class="logo">MC</div>
        <h1>Multipurpose Coding</h1>
      </a>

      <nav class="primary" aria-label="Primary">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <!-- Dark Mode Toggle -->
        <div
          class="toggle"
          title="Dark mode toggle"
        >

          <label
            class="switch"
            aria-hidden="false"
            tabindex="0"
            role="switch"
            aria-checked="true"
            id="switchLabel"
          >

            <input
              id="darkToggle"
              type="checkbox"
              aria-label="Toggle dark mode"
              checked
            >

            <span
              class="knob"
              aria-hidden="true"
            ></span>

          </label>

          <span
            style="
              font-weight:700;
              color:var(--muted);
              font-size:0.98rem;
            "
          >
            Dark
          </span>

        </div>

      </nav>

    </header>


    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <main>

      <section
        class="team-grid"
        aria-label="Club officers"
      >

        <!-- President -->
        <article
          class="member"
          aria-labelledby="pres-role"
        >

          <img
            class="portrait"
            src="assets/images/president.webp"
            alt="Photo of William Xiong"
          >

          <div
            id="pres-role"
            class="role"
          >
            President
          </div>

          <div class="name">
            William Xiong
          </div>

          <div class="info">
            Junior, likes making all sorts of things.
          </div>

        </article>


        <!-- VP -->
        <article
          class="member"
          aria-labelledby="vp-role"
        >

          <img
            class="portrait"
            src="assets/images/vp.webp"
            alt="Photo of Riland Yen"
          >

          <div
            id="vp-role"
            class="role"
          >
            VP
          </div>

          <div class="name">
            Riland Yen
          </div>

          <div class="info">
            Junior, likes to hang out w/ friends
          </div>

        </article>


        <!-- Advisor -->
        <article
          class="member"
          aria-labelledby="adv-role"
        >

          <img
            class="portrait"
            src="assets/images/advisor.webp"
            alt="Photo of Mr. Nelson"
          >

          <div
            id="adv-role"
            class="role"
          >
            Advisor
          </div>

          <div class="name">
            Mr. Nelson
          </div>

          <div class="info">
            The GOAT! He teaches NGSS and AP Physics.
          </div>

        </article>

      </section>

    </main>

  </div>


  <!-- =========================================
       DARK MODE SCRIPT
       ========================================= -->

  <script>

    // Dark mode:
    // - Defaults to DARK mode
    // - Persists the user's choice
    // - Uses the same localStorage key as index.html
    // - Supports keyboard controls
    // - Keeps aria-checked synchronized

    const toggle =
      document.getElementById('darkToggle');

    const rootEl =
      document.documentElement;

    const storageKey =
      'mpc-dark';

    const switchLabel =
      document.getElementById('switchLabel');


    /*
     * Initialize theme
     *
     * IMPORTANT:
     * If the user has never selected a theme before,
     * dark mode is automatically enabled.
     */
    (function initTheme() {

      const saved =
        localStorage.getItem(storageKey);

      if (saved !== null) {

        if (saved === '1') {

          rootEl.classList.add('dark');

          toggle.checked = true;

          switchLabel.setAttribute(
            'aria-checked',
            'true'
          );

        } else {

          rootEl.classList.remove('dark');

          toggle.checked = false;

          switchLabel.setAttribute(
            'aria-checked',
            'false'
          );

        }

      } else {

        /*
         * No saved preference:
         * DEFAULT TO DARK MODE.
         */
        rootEl.classList.add('dark');

        toggle.checked = true;

        switchLabel.setAttribute(
          'aria-checked',
          'true'
        );

        /*
         * Save dark mode so both pages
         * immediately share the preference.
         */
        localStorage.setItem(
          storageKey,
          '1'
        );

      }

    })();


    /*
     * Handle checkbox changes
     */
    toggle.addEventListener(
      'change',
      () => {

        if (toggle.checked) {

          rootEl.classList.add('dark');

          localStorage.setItem(
            storageKey,
            '1'
          );

          switchLabel.setAttribute(
            'aria-checked',
            'true'
          );

        } else {

          rootEl.classList.remove('dark');

          localStorage.setItem(
            storageKey,
            '0'
          );

          switchLabel.setAttribute(
            'aria-checked',
            'false'
          );

        }

      }
    );


    /*
     * Keyboard accessibility
     *
     * Space or Enter toggles the switch.
     */
    document
      .querySelectorAll('.switch')
      .forEach(s => {

        s.addEventListener(
          'keydown',
          e => {

            if (
              e.key === ' ' ||
              e.key === 'Enter'
            ) {

              e.preventDefault();

              toggle.checked =
                !toggle.checked;

              toggle.dispatchEvent(
                new Event('change')
              );

            }

          }
        );


        /*
         * Mouse/touch support
         */
        s.addEventListener(
          'click',
          (ev) => {

            if (
              ev.target.tagName.toLowerCase()
              === 'a'
            ) {
              return;
            }

            /*
             * The input itself is hidden.
             * Only toggle when clicking the
             * visible switch wrapper.
             */
            if (ev.target === s) {

              toggle.checked =
                !toggle.checked;

              toggle.dispatchEvent(
                new Event('change')
              );

            }

          }
        );

      });

  </script>

</body>
</html>
