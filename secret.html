```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Player</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(400px, 85%);
      padding: 28px;
      text-align: center;
      border: 2px solid #008c44;
      border-radius: 16px;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    audio {
      width: 100%;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="player">
    <h1>Audio Player</h1>

    <audio controls preload="metadata">
      <source src="assets/audio/evi.mp4" type="audio/mp4">
      Your browser does not support audio playback.
    </audio>
  </main>
</body>
</html>
