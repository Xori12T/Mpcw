<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multipurpose Coding — Projects</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent: #008c44;
      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --card-bg: #f7f7f7;
      --radius: 12px;
      --max-width: 1100px;
      --shadow-color: rgba(0,0,0,0.06);

      --base-font-size: 18px;
      --h1-size: 34px;
      --tab-height: 46px;
    }
    html.dark{
      --bg:#0b0b0b;
      --text:#f7f7f7;
      --muted:#bdbdbd;
      --card-bg:#0f0f10;
      --accent:#00a657;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Lexend", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:var(--text);
      font-size:var(--base-font-size);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.5;
    }

    .container{
      max-width:var(--max-width);
      margin:34px auto;
      padding:22px;
    }

    /* Header (same look as your site) */
    header.nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:20px;
    }
    .brand { display:flex; gap:14px; align-items:center; color:var(--text); text-decoration:none; }
    .logo {
      width:56px; height:56px; border-radius:10px;
      background:linear-gradient(135deg,var(--accent),#06aa5a);
      display:flex; align-items:center; justify-content:center;
      color:white; font-family:"Oswald"; font-weight:800; font-size:20px;
    }
    .brand h1 { margin:0; font-family:"Oswald"; font-size:var(--h1-size); font-weight:800; }

    nav.primary { display:flex; gap:14px; align-items:center; }
    nav.primary a { text-decoration:none; color:var(--text); font-weight:700; padding:6px 10px; border-radius:8px; }

    /* Dark switch (keeps behaviour/style similar to your other pages) */
    .toggle { display:flex; align-items:center; gap:10px; }
    .switch {
      --w:52px; --h:26px;
      width:var(--w); height:var(--h);
      border-radius:999px; padding:4px; display:inline-flex; align-items:center;
      background:linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.01));
      border:3px solid rgba(0,0,0,0.08);
      cursor:pointer;
    }
    html.dark .switch { background:#000; border-color:rgba(255,255,255,0.9); }
    .knob {
      width: calc(var(--h) - 8px);
      height: calc(var(--h) - 8px);
      border-radius:50%;
      background: #000;
      border: 2px solid #000;
      transform: translateX(0);
      transition: transform .18s ease, background .12s;
    }
    html.dark .knob { background:#fff; border-color:#fff; transform: translateX(calc(var(--w) - var(--h))); }

    /* Page tabs */
    .tabs {
      display:flex;
      gap:8px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      margin-bottom:18px;
    }
    .tab-btn {
      appearance:none;
      border:0;
      background:transparent;
      padding:10px 14px;
      font-family:"Oswald",sans-serif;
      font-weight:700;
      cursor:pointer;
      font-size:1.02rem;
      border-radius:10px 10px 0 0;
    }
    .tab-btn[aria-selected="true"]{
      background: linear-gradient(180deg, rgba(0,140,68,0.08), rgba(0,140,68,0.02));
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }

    main.section {
      margin-top:6px;
    }

    /* Members list (vertical cells) */
    .members-list {
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .member-card {
      display:flex;
      gap:14px;
      align-items:center;
      background:var(--card-bg);
      border-radius:12px;
      padding:12px 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.04);
      min-height:88px;
    }
    .avatar {
      width:84px; height:84px; border-radius:10px; object-fit:cover; background:#ddd; flex:0 0 84px; border:3px solid rgba(0,0,0,0.06);
    }
    .member-info { display:flex; flex-direction:column; gap:6px; }
    .member-info .name { font-family:"Oswald"; font-weight:800; font-size:1.05rem; }
    .member-info .username { color:var(--muted); font-weight:700; }
    .member-info .repo { color:var(--accent); text-decoration:underline; font-size:0.95rem; }

    /* Projects list */
    .projects-list { display:flex; flex-direction:column; gap:12px; }
    .project-card {
      background:var(--card-bg);
      border-radius:10px;
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow: 0 8px 18px rgba(0,0,0,0.04);
    }
    .project-left { min-width:220px; display:flex; flex-direction:column; gap:8px; }
    .project-meta { display:flex; flex-direction:column; gap:6px; }
    .small-input { padding:8px 10px; border-radius:8px; border:1px solid rgba(0,0,0,0.08); background:transparent; color:inherit; font:inherit; }

    .controls { margin:10px 0 16px; display:flex; gap:10px; flex-wrap:wrap; }

    /* small helpers */
    .muted { color:var(--muted); font-size:0.95rem; }
    .btn { background:var(--accent); color:white; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:800; font-family:"Oswald"; }
    .btn.secondary { background:transparent; color:var(--accent); border:2px solid var(--accent); font-weight:700; }

    /* responsive */
    @media (max-width:900px){
      .member-card { flex-direction:row; align-items:center; }
      .avatar { width:68px; height:68px; }
      .project-left { min-width:160px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- header (same brand + dark switch) -->
    <header class="nav" role="banner">
      <a class="brand" href="index.html" aria-label="Multipurpose Coding Home">
        <div class="logo">MC</div>
        <h1>Multipurpose Coding</h1>
      </a>

      <nav class="primary" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="members.html">Members</a>

        <div class="toggle" title="Dark mode toggle">
          <label class="switch" tabindex="0" role="switch" aria-checked="false" id="switchLabel">
            <input id="darkToggle" type="checkbox" aria-label="Toggle dark mode" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" />
            <span class="knob" aria-hidden="true"></span>
          </label>
        </div>
      </nav>
    </header>

    <main class="section" role="main">
      <!-- Tabs -->
      <div class="tabs" role="tablist" aria-label="Projects tabs">
        <button id="tabMembers" class="tab-btn" role="tab" aria-controls="panelMembers" aria-selected="true">Members</button>
        <button id="tabProjects" class="tab-btn" role="tab" aria-controls="panelProjects" aria-selected="false">Projects</button>
      </div>

      <!-- Members panel -->
      <section id="panelMembers" role="tabpanel" aria-labelledby="tabMembers">
        <div class="controls">
          <button id="refreshMembers" class="btn secondary">Refresh avatars & repos</button>
        </div>

        <div id="membersList" class="members-list" aria-live="polite">
          <!-- Member cards inserted here by JS -->
        </div>
      </section>

      <!-- Projects panel (hidden by default) -->
      <section id="panelProjects" role="tabpanel" aria-labelledby="tabProjects" hidden>
        <div class="controls">
          <button id="addProjectBtn" class="btn">Add project</button>
          <button id="clearProjectsBtn" class="btn secondary">Clear all</button>
        </div>

        <div id="projectsList" class="projects-list">
          <!-- Example template project card (one prefilled template shown) -->
          <div class="project-card" data-template>
            <div class="project-left">
              <label>Creator username</label>
              <input class="small-input js-creator" placeholder="github username (e.g. SpaceStationLvl17)" />
              <label>Repo name</label>
              <input class="small-input js-repo" placeholder="repo-name (e.g. my-project)" />
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn js-autofill">Auto-fill from GitHub</button>
                <button class="btn secondary js-remove">Remove</button>
              </div>
            </div>

            <div class="project-meta">
              <div class="muted">Repo preview</div>
              <div class="js-repo-preview muted">Fill creator & repo then click Auto-fill, or add link manually.</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    /********************
     * Dark mode toggle *
     ********************/
    (function(){
      const toggle = document.getElementById('darkToggle');
      const root = document.documentElement;
      const key = 'mpc-dark';
      const visual = document.querySelector('.switch');

      // init
      const saved = localStorage.getItem(key);
      if (saved === '1') {
        root.classList.add('dark');
        toggle.checked = true;
        visual.setAttribute('aria-checked','true');
      } else if (saved === '0') {
        root.classList.remove('dark');
        toggle.checked = false;
        visual.setAttribute('aria-checked','false');
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) { root.classList.add('dark'); toggle.checked = true; visual.setAttribute('aria-checked','true'); }
      }

      function setDark(on){
        if(on){
          root.classList.add('dark');
          localStorage.setItem(key,'1');
          visual.setAttribute('aria-checked','true');
        } else {
          root.classList.remove('dark');
          localStorage.setItem(key,'0');
          visual.setAttribute('aria-checked','false');
        }
      }

      // clicks & keyboard
      visual.addEventListener('click', ()=> setDark(!root.classList.contains('dark')));
      visual.addEventListener('keydown', e => {
        if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); setDark(!root.classList.contains('dark')); }
      });
    })();

    /********************
     * Tab behaviour    *
     ********************/
    (function(){
      const tabMembers = document.getElementById('tabMembers');
      const tabProjects = document.getElementById('tabProjects');
      const panelMembers = document.getElementById('panelMembers');
      const panelProjects = document.getElementById('panelProjects');

      function showMembers(){ 
        tabMembers.setAttribute('aria-selected','true'); tabProjects.setAttribute('aria-selected','false');
        panelMembers.hidden = false; panelProjects.hidden = true;
      }
      function showProjects(){
        tabMembers.setAttribute('aria-selected','false'); tabProjects.setAttribute('aria-selected','true');
        panelMembers.hidden = true; panelProjects.hidden = false;
      }

      tabMembers.addEventListener('click', showMembers);
      tabProjects.addEventListener('click', showProjects);

      // keyboard nav for tabs
      [tabMembers, tabProjects].forEach(btn => {
        btn.addEventListener('keydown', (e) => {
          if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
            e.preventDefault();
            if(btn === tabMembers) tabProjects.focus(); else tabMembers.focus();
          }
        });
      });
    })();

    /************************************
     * Members: fetch avatars & recent repo
     ************************************/
    (function(){
      // initial list of GitHub usernames (from your message)
      const memberUsernames = [
        "SpaceStationLvl17",
        "joshy912",
        "blu3z11",
        "Atlasrepublic1",
        "template-user-placeholder" // template user — won't exist on GitHub (keeps example)
      ];

      const membersList = document.getElementById('membersList');

      function makeCardSkeleton(username){
        const wrap = document.createElement('div');
        wrap.className = 'member-card';
        wrap.dataset.username = username;

        const avatar = document.createElement('img');
        avatar.className = 'avatar';
        avatar.alt = username + ' avatar';
        avatar.src = ''; // will fill

        const info = document.createElement('div');
        info.className = 'member-info';
        info.innerHTML = `
          <div class="name">Loading…</div>
          <div class="username">${username}</div>
          <div class="repo muted"></div>
        `;
        wrap.appendChild(avatar);
        wrap.appendChild(info);
        return wrap;
      }

      async function fillCard(card, username){
        const avatarEl = card.querySelector('.avatar');
        const nameEl = card.querySelector('.name');
        const userEl = card.querySelector('.username');
        const repoEl = card.querySelector('.repo');

        // default values
        nameEl.textContent = username;
        userEl.innerHTML = `<a href="https://github.com/${username}" target="_blank" rel="noopener noreferrer">${username}</a>`;

        // If username is obviously placeholder, don't fetch
        if(username.includes('template') || username.includes('placeholder')){
          avatarEl.style.background = '#ddd';
          avatarEl.src = '';
          repoEl.textContent = '';
          return;
        }

        try {
          // fetch user profile
          const userResp = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);
          if (!userResp.ok) throw new Error('not found');
          const userJson = await userResp.json();

          // avatar
          if(userJson.avatar_url){
            avatarEl.src = userJson.avatar_url;
            avatarEl.alt = (userJson.name || username) + ' avatar';
          } else {
            avatarEl.src = '';
            avatarEl.style.background = '#ddd';
          }

          // name display
          if (userJson.name && userJson.name.trim().length) {
            // show first name only (split by space)
            const first = userJson.name.trim().split(' ')[0];
            nameEl.textContent = first;
          } else {
            nameEl.textContent = username;
          }

          // username / profile link
          userEl.innerHTML = `<a href="${userJson.html_url}" target="_blank" rel="noopener noreferrer">${username}</a>`;

          // fetch most recently updated repo (if any)
          const reposResp = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?sort=updated&per_page=1`);
          if (reposResp.ok){
            const repos = await reposResp.json();
            if (Array.isArray(repos) && repos.length){
              const r = repos[0];
              repoEl.innerHTML = `<a class="repo" href="${r.html_url}" target="_blank" rel="noopener noreferrer">${r.name}</a>`;
            } else {
              repoEl.textContent = '';
            }
          } else {
            repoEl.textContent = '';
          }
        } catch(e) {
          // network or not found: graceful fallback
          avatarEl.src = '';
          avatarEl.style.background = '#ddd';
          nameEl.textContent = username;
          userEl.innerHTML = `<a href="https://github.com/${username}" target="_blank" rel="noopener noreferrer">${username}</a>`;
          repoEl.textContent = '';
        }
      }

      async function renderMembers(){
        membersList.innerHTML = '';
        for(const u of memberUsernames){
          const card = makeCardSkeleton(u);
          membersList.appendChild(card);
          // fill each card (don't await serially for speed)
          fillCard(card,u).catch(()=>{});
        }
      }

      // initial render
      renderMembers();

      // Refresh button
      document.getElementById('refreshMembers').addEventListener('click', () => renderMembers());
    })();

    /************************************
     * Projects: add/remove and autofill
     ************************************/
    (function(){
      const projectsList = document.getElementById('projectsList');
      const addBtn = document.getElementById('addProjectBtn');
      const clearBtn = document.getElementById('clearProjectsBtn');

      function createProjectCard({creator='', repo='' } = {}){
        const card = document.createElement('div');
        card.className = 'project-card';

        card.innerHTML = `
          <div class="project-left">
            <label>Creator username</label>
            <input class="small-input js-creator" value="${escapeHtml(creator)}" placeholder="github username" />
            <label>Repo name</label>
            <input class="small-input js-repo" value="${escapeHtml(repo)}" placeholder="repo-name" />
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button class="btn js-autofill">Auto-fill from GitHub</button>
              <button class="btn secondary js-remove">Remove</button>
            </div>
          </div>
          <div class="project-meta">
            <div class="muted">Repo preview</div>
            <div class="js-repo-preview muted">Fill creator & repo then click Auto-fill, or add link manually.</div>
          </div>
        `;

        // wire actions
        card.querySelector('.js-remove').addEventListener('click', () => card.remove());
        card.querySelector('.js-autofill').addEventListener('click', async () => {
          const creatorInput = card.querySelector('.js-creator');
          const repoInput = card.querySelector('.js-repo');
          const preview = card.querySelector('.js-repo-preview');
          const creatorVal = creatorInput.value.trim();
          const repoVal = repoInput.value.trim();
          if(!creatorVal || !repoVal){ preview.textContent = 'Enter both creator and repo name first.'; return; }
          preview.textContent = 'Fetching from GitHub…';
          try {
            const resp = await fetch(`https://api.github.com/repos/${encodeURIComponent(creatorVal)}/${encodeURIComponent(repoVal)}`);
            if(!resp.ok) throw new Error('not found');
            const j = await resp.json();
            // fill preview
            const desc = j.description ? ` — ${j.description}` : '';
            preview.innerHTML = `<strong><a href="${j.html_url}" target="_blank" rel="noopener noreferrer">${j.full_name}</a></strong><div class="muted">${desc}</div>`;
          } catch(err){
            preview.textContent = 'Repository not found or network error.';
          }
        });

        return card;
      }

      function escapeHtml(s){
        return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[ch]));
      }

      // add initial template card (clone from your pre-filled template)
      const templateCard = projectsList.querySelector('[data-template]');
      if(templateCard){
        // remove the data-template attribute and keep it as first card but wire up its actions
        templateCard.removeAttribute('data-template');
        const newCard = createProjectCard();
        // copy inputs into newCard if template had defaults (we left empty)
        projectsList.replaceChild(newCard, templateCard);
      }

      addBtn.addEventListener('click', () => {
        const c = createProjectCard();
        projectsList.appendChild(c);
        // focus new card's first input
        c.querySelector('.js-creator').focus();
      });

      clearBtn.addEventListener('click', () => {
        if(!confirm('Clear all project cards?')) return;
        projectsList.innerHTML = '';
      });
    })();
  </script>
</body>
</html>
